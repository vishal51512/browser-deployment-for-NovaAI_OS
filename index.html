<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaAI_OS Web Emulator</title>
<script src="https://copy.sh/v86/build/libv86.js"></script>

    <style>
        body {
            margin: 0;
            background: black;
            color: white;
            text-align: center;
            font-family: Arial;
        }

        h1 {
            margin-top: 20px;
        }

        #screen_container {
            width: 100%;
            height: 85vh;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>NovaAI_OS Web Emulator</h1>

    <div id="screen_container"></div>

    <script>
     window.onload = function () {
    new V86Starter({
        wasm_path: "v86.wasm",

        memory_size: 512 * 1024 * 1024,
        vga_memory_size: 8 * 1024 * 1024,

        screen_container: document.getElementById("screen_container"),

        bios: {
            url: "seabios.bin"
        },

        vga_bios: {
            url: "vgabios.bin"
        },

        cdrom: {
            url: "NovaAI-OS.iso"
        },

        boot_order: 0x132,
        autostart: true
    });
};
    </script>

</body>
</html>
